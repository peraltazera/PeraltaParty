# Hospedagem gratuita no Render (plano Free). Alternativa ao cadastro manual: "New > Blueprint".
services:
  - type: web
    name: party-game
    runtime: node
    plan: free
    # --include=dev: o Vite (que monta o site) é dependência de desenvolvimento
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
